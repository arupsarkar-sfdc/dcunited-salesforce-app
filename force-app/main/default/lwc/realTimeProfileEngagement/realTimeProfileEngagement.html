
<template>
    <lightning-card title="Customer Activity Timeline">
        <div class="slds-p-around_medium">
            <div class="slds-grid slds-gutters slds-m-bottom_medium">
                <div class="slds-col slds-size_4-of-5">
                    <lightning-input 
                        label="Enter Source Record ID"
                        variant="label-hidden"
                        placeholder="Enter device id to search"
                        value={sourceId}
                        onchange={handleSourceIdChange}>
                    </lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-5 slds-align-end">
                    <lightning-button 
                        label="Refresh"
                        variant="brand-outline"
                        icon-name="utility:refresh"
                        onclick={handleRefresh}
                        >
                    </lightning-button>
                </div>
            </div>

            <div class="slds-tabs_default">
                <ul class="slds-tabs_default__nav" role="tablist">
                    <li class={browseCssClass} role="presentation" onclick={handleTabClick} data-tab="browse">
                        <a class="slds-tabs_default__link" role="tab">
                            <lightning-icon icon-name="standard:catalog" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                            Product Browse
                        </a>
                    </li>
                    <li class={cartCssClass} role="presentation" onclick={handleTabClick} data-tab="cart">
                        <a class="slds-tabs_default__link" role="tab">
                            <lightning-icon icon-name="standard:orders" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                            Shopping Cart
                        </a>
                    </li>
                </ul>

                <div class="slds-tabs_default__content slds-show">
                    <ul class="slds-timeline">
                        <template for:each={filteredActivities} for:item="activity">
                            <li key={activity.id} class="slds-timeline__item">
                                    <div class="slds-media">
                                        <div class="slds-media__figure">
                                            <button class="slds-button slds-button_icon" title="Toggle details" onclick={handleToggleDetails} data-id={activity.id}>
                                                <lightning-icon icon-name="utility:switch" size="x-small" class="slds-button__icon slds-timeline__details-action-icon"></lightning-icon>
                                            </button>
                                            <div class="slds-icon_container slds-timeline__icon" title={activity.type}>
                                                <lightning-icon icon-name={activity.iconName} size="small"></lightning-icon>
                                            </div>
                                        </div>                                        
                                        <div class="slds-media__body">
                                            <div class="slds-grid slds-grid_align-spread">
                                                <h3 class="slds-truncate" title={activity.title}>
                                                    <strong>{activity.title}</strong>
                                                </h3>
                                                <p class="slds-timeline__date">
                                                    <span class="slds-timeline__date-pill">
                                                        {activity.createdDate}
                                                    </span>
                                                    
                                                </p>
                                            </div>
                                            <p class="slds-m-top_xx-small">
                                                {activity.description}
                                            </p>
                                        </div>
                                    </div>
                            </li>
                        </template>
                    </ul>
                </div>
            </div>
        </div>
    </lightning-card>
</template>
